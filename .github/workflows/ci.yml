name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts skips electron-rebuild, which needs the Electron
      # binary + native toolchain. Typecheck and lint don't need native
      # modules. Wiring vitest into CI is a follow-up (requires a Linux
      # better-sqlite3 build step).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
